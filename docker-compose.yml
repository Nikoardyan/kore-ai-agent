services:
  # FIX: Tambahkan service PostgreSQL sehingga `docker compose up` langsung bisa
  # jalan tanpa setup database manual terlebih dahulu.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: employee_agent
      POSTGRES_USER: employee_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employee_agent -d employee_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://employee_agent:${POSTGRES_PASSWORD:-change-this-password}@postgres:5432/employee_agent
      APP_ENV: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload

  # Opsional: isi database lokal dengan data demo. Tidak dijalankan pada `docker compose up`
  # agar data operasional tidak tertimpa.
  seed:
    profiles: ["seed"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://employee_agent:${POSTGRES_PASSWORD:-change-this-password}@postgres:5432/employee_agent
    depends_on:
      postgres:
        condition: service_healthy
    command: python seed_neon.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
